<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WILP QA Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f4f5f7; }
  .card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; }
  .input { border:1px solid #d1d5db; border-radius:6px; padding:8px 10px; width:100%; font-size:14px; }
  .btn { border-radius:6px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .btn-primary { background:#1d4ed8; color:#fff; }
  .btn-primary:hover { background:#1e40af; }
  .btn-secondary { background:#fff; border-color:#d1d5db; color:#111827; }
  .btn-secondary:hover { background:#f9fafb; }
  .field-label { font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:4px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
